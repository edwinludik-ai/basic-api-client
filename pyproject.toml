[project]
name = "basic-api-client"
version = "0.1.0"
description = "A very basic Python client for APIs behind OAuth2 login"
requires-python = ">=3.9"
dependencies = [
    "requests-oauthlib>=1.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["basic_api_client*"]
